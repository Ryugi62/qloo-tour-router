<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tour Router</title>
<style>
  :root { --bg:#fafaf7; --ink:#191f28; --sub:#6b7684; --line:#e5e8eb; --accent:#3182f6; --gen:#b0b8c1; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17171c; --ink:#f2f4f6; --sub:#9ea7b3; --line:#2c2f36; --card:#202027; --gen:#5c6370; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; } .sub { color: var(--sub); margin: 0 0 20px; }
  form { display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 16px; }
  input, select, button { font: inherit; padding: 12px 14px; border-radius: 12px; border:1px solid var(--line); background: var(--card); color: var(--ink); }
  input { flex: 1 1 260px; } button { background: var(--accent); color:#fff; border:0; font-weight:600; cursor:pointer; }
  .badge { display:inline-block; font-size:13px; padding:2px 10px; border-radius:99px; background:#fff3d6; color:#7a5200; }
  .grid { display:grid; grid-template-columns: 1.3fr 1fr; gap:16px; } @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 16px; padding: 16px; }
  svg { width:100%; height:auto; display:block; } .legend { display:flex; gap:16px; font-size:14px; color:var(--sub); }
  .kpis { display:grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi b { display:block; font-size: 22px; } .kpi span { color: var(--sub); font-size: 13px; }
  ol { padding-left: 20px; margin: 0; } li { margin: 6px 0; } .muted { color: var(--sub); font-size: 14px; }
  pre { white-space: pre-wrap; background: var(--bg); padding: 12px; border-radius: 12px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Tour Router</h1>
  <p class="sub">For small booking agencies: route an artist where their audience's taste actually is — and see what changed versus a generic big-market plan.</p>
  <form id="f">
    <input id="artist" placeholder="Artist name" required />
    <select id="home"><option value="40.71,-74.01">Start: New York</option><option value="34.05,-118.24">Start: Los Angeles</option><option value="41.88,-87.63">Start: Chicago</option><option value="30.27,-97.74">Start: Austin</option></select>
    <button>Plan tour</button>
  </form>
  <p id="mode"></p>
  <div id="out"></div>
</main>
<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const meta = await (await fetch('/api/meta')).json();
if (meta.dataMode === 'sample') {
  $('#mode').innerHTML = '<span class="badge">Sample data — synthetic affinities, no API key configured</span>';
  $('#artist').value = meta.sampleArtists[0].name;
}
function map(taste, generic) {
  const W = 640, H = 360, all = [...taste.stops, ...generic.stops].map((s) => s.city);
  const lats = all.map((c) => c.lat), lons = all.map((c) => c.lon);
  const [a0, a1, o0, o1] = [Math.min(...lats) - 1, Math.max(...lats) + 1, Math.min(...lons) - 2, Math.max(...lons) + 2];
  const P = (c) => [((c.lon - o0) / (o1 - o0)) * W, H - ((c.lat - a0) / (a1 - a0)) * H];
  const path = (p) => p.stops.map((s) => P(s.city).join(',')).join(' ');
  const dots = taste.stops.map((s, i) => { const [x, y] = P(s.city); return `<circle cx="${x}" cy="${y}" r="7" fill="var(--accent)"/><text x="${x + 10}" y="${y + 4}" font-size="13" fill="currentColor">${i + 1}. ${esc(s.city.name.split(',')[0])}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Route map"><polyline points="${path(generic)}" fill="none" stroke="var(--gen)" stroke-width="2" stroke-dasharray="6 6"/><polyline points="${path(taste)}" fill="none" stroke="var(--accent)" stroke-width="3"/>${dots}</svg>
  <div class="legend"><span>━ Taste-based route</span><span>┅ Generic big-market route</span></div>`;
}
$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#out').innerHTML = '<p class="muted">Planning…</p>';
  const r = await fetch(`/api/plan?artist=${encodeURIComponent($('#artist').value)}&home=${$('#home').value}`);
  const j = await r.json();
  if (!r.ok) { $('#out').innerHTML = `<p>${esc(j.error)}</p>`; return; }
  const L = j.lift;
  $('#out').innerHTML = `<div class="grid"><div class="card">${map(j.taste, j.generic)}</div><div class="card">
    <div class="kpis"><div class="kpi"><b>${(L.meanAffinityTaste).toFixed(2)}</b><span>avg affinity (taste)</span></div>
    <div class="kpi"><b>${(L.meanAffinityGeneric).toFixed(2)}</b><span>avg affinity (generic)</span></div>
    <div class="kpi"><b>${Math.round((1 - L.jaccard) * 100)}%</b><span>cities changed</span></div></div>
    <p class="muted">Added by taste: ${esc(L.added.join(', ') || '—')}<br/>Dropped: ${esc(L.dropped.join(', ') || '—')}</p>
    <ol>${j.taste.stops.map((s) => `<li><b>${esc(s.city.name)}</b> — affinity ${s.affinity.toFixed(2)} (#${s.affinityRank})<br/><span class="muted">${esc((s.city.venues || []).map((v) => `${v.name} ${v.affinity.toFixed(2)}`).join(' · '))}</span></li>`).join('')}</ol>
    ${j.taste.warnings.length ? `<p class="muted">⚠ ${esc(j.taste.warnings.join(' · '))}</p>` : ''}
  </div></div><div class="card" style="margin-top:16px"><b>Promoter pitch draft</b><pre>${esc(j.pitch)}</pre></div>`;
});
</script>
</body>
</html>
